<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFT Reading & Quiz Tracker</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --success-color: #2ec4b6;
            --danger-color: #e71d36;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f7;
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .selector-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        select {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid var(--primary-color);
            background: white;
            cursor: pointer;
            outline: none;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .reading-box {
            font-size: 18px;
            letter-spacing: 0.5px;
            white-space: pre-line;
            background: var(--secondary-color);
            padding: 20px;
            border-left: 5px solid var(--primary-color);
            border-radius: 5px;
            margin-top: 15px;
        }

        h2 {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 5px;
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
        }

        .options-list {
            list-style: none;
            margin-top: 10px;
        }

        .option-item {
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item:hover {
            background-color: #f1f3f5;
        }

        .option-item input {
            cursor: pointer;
        }

        /* Status Jawaban */
        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger-color) !important;
            color: #721c24;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .score-display {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        /* Tabel Kosakata */
        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .vocab-table th, .vocab-table td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        .vocab-table th {
            background-color: var(--secondary-color);
        }

        /* Bagian Esai / Pertanyaan Isian */
        .essay-block {
            margin-top: 15px;
            padding: 12px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 3px;
        }
        
        .essay-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 5px;
        }

        .essay-answer {
            display: none;
            margin-top: 5px;
            font-weight: bold;
            color: #856404;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JFT-Basic Reading Practice</h1>
        <div class="selector-zone">
            <label for="dateSelect">Pilih Tanggal Belajar:</label>
            <select id="dateSelect" onchange="loadData()"></select>
        </div>
    </header>

    <!-- Bagian Membaca -->
    <section class="card">
        <h2>読み物 (Bacaan)</h2>
        <div id="readingContent" class="reading-box"></div>
    </section>

    <!-- Bagian Kuis Pilihan Ganda -->
    <section class="card">
        <h2>読解問題 (Kuis Pilihan Ganda)</h2>
        <div id="quizContent"></div>
        <button class="btn" onclick="checkAnswers()">Periksa Jawaban</button>
        <div id="scoreDisplay" class="score-display"></div>
    </section>

    <!-- Bagian Pertanyaan Terbuka / Esai (Jika Ada) -->
    <section class="card" id="essaySection" style="display:none;">
        <h2>質問に答えてください (Pertanyaan Isian)</h2>
        <div id="essayContent"></div>
    </section>

    <!-- Bagian Kosakata (Jika Ada) -->
    <section class="card" id="vocabSection" style="display:none;">
        <h2>語彙 (Kosakata)</h2>
        <table class="vocab-table">
            <thead>
                <tr>
                    <th>Kata Kerja / Benda</th>
                    <th>Arti (Bahasa Indonesia)</th>
                </tr>
            </thead>
            <tbody id="vocabContent"></tbody>
        </table>
    </section>
</div>

    // Inisialisasi Pilihan Tanggal
    const dateSelect = document.getElementById('dateSelect');
    jftDatabase.forEach((data, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.textContent = data.date;
        dateSelect.appendChild(option);
    });

    // Memuat Data Berdasarkan Tanggal yang Dipilih
    function loadData() {
        const index = dateSelect.value;
        const currentData = jftDatabase[index];

        // 1. Load Teks Bacaan
        document.getElementById('readingContent').textContent = currentData.readingText;

        // 2. Load Soal Pilihan Ganda
        const quizContent = document.getElementById('quizContent');
        quizContent.innerHTML = "";
        document.getElementById('scoreDisplay').style.display = "none";

        currentData.questions.forEach((quiz, qIdx) => {
            let qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            qBlock.innerHTML = `<p><strong>Q${qIdx + 1}. ${quiz.q}</strong></p>`;

            let oList = document.createElement('ul');
            oList.className = 'options-list';

            quiz.options.forEach((opt, oIdx) => {
                let li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `
                    <input type="radio" name="q${qIdx}" value="${oIdx}" id="q${qIdx}_o${oIdx}">
                    <label for="q${qIdx}_o${oIdx}">${opt}</label>
                `;
                oList.appendChild(li);
            });

            qBlock.appendChild(oList);
            quizContent.appendChild(qBlock);
        });

        // 3. Load Soal Esai / Pertanyaan Terbuka (Jika ada)
        const essaySection = document.getElementById('essaySection');
        const essayContent = document.getElementById('essayContent');
        if(currentData.essayQuestions && currentData.essayQuestions.length > 0) {
            essaySection.style.display = "block";
            essayContent.innerHTML = "";
            currentData.essayQuestions.forEach((eq, eqIdx) => {
                let eqBlock = document.createElement('div');
                eqBlock.className = 'essay-block';
                eqBlock.innerHTML = `
                    <p><strong>問${eqIdx + 1}: ${eq.q}</strong></p>
                    <button class="essay-btn" onclick="toggleEssayAnswer(${eqIdx})">Lihat Jawaban</button>
                    <p id="essayAns_${eqIdx}" class="essay-answer">Kunci Jawaban: ${eq.a}</p>
                `;
                essayContent.appendChild(eqBlock);
            });
        } else {
            essaySection.style.display = "none";
        }

        // 4. Load Kosakata (Jika ada)
        const vocabSection = document.getElementById('vocabSection');
        const vocabContent = document.getElementById('vocabContent');
        if (currentData.vocabulary && currentData.vocabulary.length > 0) {
            vocabSection.style.display = "block";
            vocabContent.innerHTML = "";
            currentData.vocabulary.forEach(v => {
                let row = document.createElement('tr');
                row.innerHTML = `<td><strong>${v.word}</strong></td><td>${v.meaning}</td>`;
                vocabContent.appendChild(row);
            });
        } else {
            vocabSection.style.display = "none";
        }
    }

    // Fungsi Cek Kunci Jawaban Kuis
    function checkAnswers() {
        const index = dateSelect.value;
        const currentData = jftDatabase[index];
        let score = 0;
        let totalQuestions = currentData.questions.length;

        currentData.questions.forEach((quiz, qIdx) => {
            const selectedOpt = document.querySelector(`input[name="q${qIdx}"]:checked`);
            const optionsItems = document.querySelectorAll(`input[name="q${qIdx}"]`);

            optionsItems.forEach((input, oIdx) => {
                let parentLi = input.parentElement;
                // Reset styling kelas dulu
                parentLi.classList.remove('correct', 'wrong');

                // Jika ini adalah jawaban yang benar, beri warna hijau
                if (oIdx === quiz.correct) {
                    parentLi.classList.add('correct');
                }
                
                // Jika user memilih opsi ini dan salah, beri warna merah
                if (selectedOpt && parseInt(selectedOpt.value) === oIdx && oIdx !== quiz.correct) {
                    parentLi.classList.add('wrong');
                }
            });

            if (selectedOpt && parseInt(selectedOpt.value) === quiz.correct) {
                score++;
            }
        });

        // Tampilkan Nilai Akhir
        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.style.display = "block";
        scoreDisplay.innerHTML = `Skor Anda: ${score} / ${totalQuestions} (${Math.round((score/totalQuestions)*100)}%)`;
    }

    // Fungsi Toggle Menampilkan Kunci Jawaban Isian
    function toggleEssayAnswer(idx) {
        const ans = document.getElementById(`essayAns_${idx}`);
        if(ans.style.display === "block") {
            ans.style.display = "none";
        } else {
            ans.style.display = "block";
        }
    }

    // Load Pertama Kali Saat Buka Halaman
    window.onload = loadData;
</script>
