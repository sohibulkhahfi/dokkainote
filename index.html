<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFT Reading & Quiz Tracker</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --success-color: #2ec4b6;
            --danger-color: #e71d36;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f7;
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
        }

        /* --- TAMPILAN GRID MENU AWAL --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding-bottom: 30px;
        }

        .grid-card {
            background: white;
            padding: 25px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background-color 0.2s;
            border: 2px solid transparent;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .grid-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .grid-card p {
            color: #888;
            font-size: 0.85rem;
            margin-top: auto;
        }

        /* LOGIKA WARNA DINAMIS */
        .grid-card.selesai {
            background-color: #d4edda;
            border-color: var(--success-color);
        }
        .grid-card.selesai h3 {
            color: #155724;
        }
        .grid-card.selesai p {
            color: #155724;
            opacity: 0.7;
        }

        .grid-card.gold {
            background: linear-gradient(135deg, #fff9e6 0%, #ffeaa7 100%);
            border-color: #f1c40f;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.2);
        }
        .grid-card.gold h3 {
            color: #b7791f;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        .grid-card.gold p {
            color: #b7791f;
            font-weight: bold;
        }

        /* --- TAMPILAN KUIS --- */
        .hidden {
            display: none !important;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }

        .quiz-title-header {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .reading-box {
            font-size: 18px;
            letter-spacing: 0.5px;
            white-space: pre-line;
            background: var(--secondary-color);
            padding: 20px;
            border-left: 5px solid var(--primary-color);
            border-radius: 5px;
            margin-top: 15px;
        }

        h2 {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 5px;
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
        }

        .options-list {
            list-style: none;
            margin-top: 10px;
        }

        .option-item {
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item:hover {
            background-color: #f1f3f5;
        }

        .option-item input {
            cursor: pointer;
        }

        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger-color) !important;
            color: #721c24;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #357abd;
        }
        
        /* Gaya tombol saat berubah menjadi 'Mulai Lagi' */
        .btn.btn-reset {
            background-color: #ff9f43;
        }
        .btn.btn-reset:hover {
            background-color: #ee5253;
        }

        .score-display {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .vocab-table th, .vocab-table td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        .vocab-table th {
            background-color: var(--secondary-color);
        }

        .essay-block {
            margin-top: 15px;
            padding: 12px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 3px;
        }
        
        .essay-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 5px;
        }

        .essay-answer {
            display: none;
            margin-top: 5px;
            font-weight: bold;
            color: #856404;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JFT-Basic Reading Practice</h1>
        <p class="subtitle" id="headerSubtitle">Pilih materi bacaan di bawah ini untuk memulai latihan.</p>
    </header>

    <!-- BAGIAN 1: MENU GRID -->
    <div id="homeView" class="grid-container"></div>

    <!-- BAGIAN 2: TAMPILAN SOAL & BACAAN -->
    <div id="quizView" class="hidden">
        <button class="btn-back" onclick="goHome()">&#8592; Kembali ke Menu Pilihan</button>
        
        <h2 id="quizMainTitle" class="quiz-title-header"></h2>

        <section class="card">
            <h2>読み物 (Bacaan)</h2>
            <div id="readingContent" class="reading-box"></div>
        </section>

        <section class="card">
            <h2>読解問題 (Kuis Pilihan Ganda)</h2>
            <div id="quizContent"></div>
            <!-- Ditambahkan ID actionBtn untuk mempermudah manipulasi tombol -->
            <button class="btn" id="actionBtn" onclick="handleQuizAction()">Periksa Jawaban</button>
            <div id="scoreDisplay" class="score-display"></div>
        </section>

        <section class="card" id="essaySection" style="display:none;">
            <h2>質問に答えてください (Pertanyaan Isian)</h2>
            <div id="essayContent"></div>
        </section>

        <section class="card" id="vocabSection" style="display:none;">
            <h2>語彙 (Kosakata)</h2>
            <table class="vocab-table">
                <thead>
                    <tr>
                        <th>Kata Kerja / Benda</th>
                        <th>Arti (Bahasa Indonesia)</th>
                    </tr>
                </thead>
                <tbody id="vocabContent"></tbody>
            </table>
        </section>
    </div>
</div>

<div id="customAlert" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div style="background-color: white; padding: 30px; border-radius: 10px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease;">
        <!-- Ikon Peringatan (Kuning) -->
        <div style="font-size: 50px; color: #ff9f43; margin-bottom: 15px;">⚠️</div>
        <h3 style="color: #2c3e50; margin-bottom: 10px; font-size: 1.3rem;">Belum Selesai!</h3>
        <p id="customAlertMessage" style="color: #666; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;"></p>
        <button onclick="closeCustomAlert()" style="background-color: #4a90e2; color: white; border: none; padding: 10px 30px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s;">Mengerti</button>
    </div>
</div>

    let activeQuizIndex = -1;
    let isChecked = false; // Status penanda apakah jawaban sudah diperiksa

    function renderGrid() {
        const homeView = document.getElementById('homeView');
        homeView.innerHTML = "";

        jftDatabase.forEach((data, index) => {
            const storageKey = `jft_quiz_${data.date.replace(/ /g, "_")}`;
            const count = parseInt(localStorage.getItem(storageKey)) || 0;

            let card = document.createElement('div');
            card.className = 'grid-card';

            if (count > 5) {
                card.classList.add("gold");
            } else if (count > 0) {
                card.classList.add("selesai");
            }

            const countText = count > 0 ? `<br><small style="opacity: 0.8;">(${count}x Selesai)</small>` : "";

            card.innerHTML = `
                <h3>${data.title}${countText}</h3>
                <p>Ditambahkan: ${data.date}</p>
            `;
            
            card.onclick = () => openQuiz(index);
            homeView.appendChild(card);
        });
    }

    function openQuiz(index) {
        activeQuizIndex = index;
        isChecked = false; // Reset status setiap kali membuka kuis baru
        
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('quizView').classList.remove('hidden');
        document.getElementById('headerSubtitle').style.display = 'none';

        // Mengembalikan tombol ke keadaan awal
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = "Periksa Jawaban";
        actionBtn.classList.remove('btn-reset');

        const currentData = jftDatabase[index];
        document.getElementById('quizMainTitle').innerHTML = currentData.title;
        document.getElementById('readingContent').textContent = currentData.readingText;

        const quizContent = document.getElementById('quizContent');
        quizContent.innerHTML = "";
        document.getElementById('scoreDisplay').style.display = "none";

        currentData.questions.forEach((quiz, qIdx) => {
            let qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            qBlock.innerHTML = `<p><strong>Q${qIdx + 1}. ${quiz.q}</strong></p>`;

            let oList = document.createElement('ul');
            oList.className = 'options-list';

            quiz.options.forEach((opt, oIdx) => {
                let li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `
                    <input type="radio" name="q${qIdx}" value="${oIdx}" id="q${qIdx}_o${oIdx}">
                    <label for="q${qIdx}_o${oIdx}">${opt}</label>
                `;
                oList.appendChild(li);
            });

            qBlock.appendChild(oList);
            quizContent.appendChild(qBlock);
        });

        // Load Esai
        const essaySection = document.getElementById('essaySection');
        const essayContent = document.getElementById('essayContent');
        if(currentData.essayQuestions && currentData.essayQuestions.length > 0) {
            essaySection.style.display = "block";
            essayContent.innerHTML = "";
            currentData.essayQuestions.forEach((eq, eqIdx) => {
                let eqBlock = document.createElement('div');
                eqBlock.className = 'essay-block';
                eqBlock.innerHTML = `
                    <p><strong>問${eqIdx + 1}: ${eq.q}</strong></p>
                    <button class="essay-btn" onclick="toggleEssayAnswer(${eqIdx})">Lihat Jawaban</button>
                    <p id="essayAns_${eqIdx}" class="essay-answer">Kunci Jawaban: ${eq.a}</p>
                `;
                essayContent.appendChild(eqBlock);
            });
        } else {
            essaySection.style.display = "none";
        }

        // Load Kosakata
        const vocabSection = document.getElementById('vocabSection');
        const vocabContent = document.getElementById('vocabContent');
        if (currentData.vocabulary && currentData.vocabulary.length > 0) {
            vocabSection.style.display = "block";
            vocabContent.innerHTML = "";
            currentData.vocabulary.forEach(v => {
                let row = document.createElement('tr');
                row.innerHTML = `<td><strong>${v.word}</strong></td><td>${v.meaning}</td>`;
                vocabContent.appendChild(row);
            });
        } else {
            vocabSection.style.display = "none";
        }
    }

    function goHome() {
        document.getElementById('quizView').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('headerSubtitle').style.display = 'block';
        activeQuizIndex = -1;
        renderGrid();
    }

    // Fungsi Pengendali Aksi Tombol Utama
    function handleQuizAction() {
        if (!isChecked) {
            checkAnswers();
        } else {
            resetQuiz();
        }
    }

    // Mengubah fungsi checkAnswers() sesuai keinginan Anda
function checkAnswers() {
    if (activeQuizIndex === -1) return;
    
    const currentData = jftDatabase[activeQuizIndex];
    let totalQuestions = currentData.questions.length;

    // --- VALIDASI JAWABAN DENGAN CUSTOM ALERT ---
    const answeredCount = document.querySelectorAll('#quizContent input[type="radio"]:checked').length;

    if (answeredCount < totalQuestions) {
        // Memanggil alert buatan kita yang lebih cantik
        showCustomAlert("Ada soal yang belum diselesaikan. Mohon isi semua jawaban terlebih dahulu sebelum memeriksa!");
        return; 
    }
    // --------------------------------------------

    let score = 0;

    currentData.questions.forEach((quiz, qIdx) => {
        const selectedOpt = document.querySelector(`input[name="q${qIdx}"]:checked`);
        const optionsItems = document.querySelectorAll(`input[name="q${qIdx}"]`);

        optionsItems.forEach((input, oIdx) => {
            let parentLi = input.parentElement;
            parentLi.classList.remove('correct', 'wrong');

            // Berikan warna tanda jawaban
            if (oIdx === quiz.correct) {
                parentLi.classList.add('correct');
            }
            if (selectedOpt && parseInt(selectedOpt.value) === oIdx && oIdx !== quiz.correct) {
                parentLi.classList.add('wrong');
            }

            // MATIKAN INPUT: Semua radio button dinonaktifkan agar tidak bisa dipilih lagi
            input.disabled = true;
        });

        if (selectedOpt && parseInt(selectedOpt.value) === quiz.correct) {
            score++;
        }
    });

    const scoreDisplay = document.getElementById('scoreDisplay');
    scoreDisplay.style.display = "block";
    scoreDisplay.innerHTML = `Skor Anda: ${score} / ${totalQuestions} (${Math.round((score/totalQuestions)*100)}%)`;

    // Update progress di local storage
    const storageKey = `jft_quiz_${currentData.date.replace(/ /g, "_")}`;
    let currentCount = parseInt(localStorage.getItem(storageKey)) || 0;
    currentCount += 1;
    localStorage.setItem(storageKey, currentCount);

    // UBAH TOMBOL: Set status menjadi true, ganti teks tombol, dan ubah warnanya
    isChecked = true;
    const actionBtn = document.getElementById('actionBtn');
    actionBtn.innerText = "Mulai Lagi";
    actionBtn.classList.add('btn-reset');
}

    // Fungsi untuk mengulang kuis kembali ke keadaan bersih semula
    function resetQuiz() {
        if (activeQuizIndex === -1) return;

        isChecked = false;
        
        // Kembalikan tombol ke setelan awal
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = "Periksa Jawaban";
        actionBtn.classList.remove('btn-reset');

        // Sembunyikan kembali skor tampilan
        document.getElementById('scoreDisplay').style.display = "none";

        // Bersihkan warna lis jawaban dan hidupkan kembali input radio
        const allRadioInputs = document.querySelectorAll('#quizContent input[type="radio"]');
        allRadioInputs.forEach(input => {
            input.disabled = false;
            input.checked = false; // Hapus centang pilihan lama
            input.parentElement.classList.remove('correct', 'wrong');
        });
        
        // Sembunyikan kembali esai bila sempat dibuka
        const currentData = jftDatabase[activeQuizIndex];
        if(currentData.essayQuestions) {
            currentData.essayQuestions.forEach((_, idx) => {
                const ans = document.getElementById(`essayAns_${idx}`);
                if(ans) ans.style.display = "none";
            });
        }
    }

    function toggleEssayAnswer(idx) {
        const ans = document.getElementById(`essayAns_${idx}`);
        ans.style.display = (ans.style.display === "block") ? "none" : "block";
    }

    function showCustomAlert(message) {
    document.getElementById('customAlertMessage').innerText = message;
    document.getElementById('customAlert').style.display = 'flex';
}

function closeCustomAlert() {
    document.getElementById('customAlert').style.display = 'none';
}
